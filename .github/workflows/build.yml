name: Build FIFA Street Android Recomp

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          repository: samuelit0davila/fifa-street-pc-port
          ref: main
          submodules: recursive

      - name: Install Dependencies and Clang 20
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg cmake ninja-build unzip pkg-config libgtk-3-dev libsdl2-dev libvulkan-dev libx11-dev libx11-xcb-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20 libc++-20-dev libc++abi-20-dev

      - name: Setup ReXGlue SDK
        run: |
          git config --global core.symlinks true
          git clone https://github.com/rexglue/rexglue-sdk.git ReXGlue
          cd ReXGlue
          git checkout c94f5ebdcb3c9d1a460ca48e04f9758448f8d518
          git submodule update --init --recursive
          git tag -l | xargs -r git tag -d || true
          sed -i 's/FATAL_ERROR/STATUS/g' cmake/rex_version.cmake
          cd ..

      - name: Configure and Build
        run: |
          cd Installer/recomp-template
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DREXSDK_DIR="../../../ReXGlue" \
            ..
          cmake --build .

      - name: Save Compiled Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fifa-street-android-build
          path: Installer/recomp-template/build/**
